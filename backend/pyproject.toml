[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["migrations/versions"]  # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]  # errors, pyflakes, import order, bugbear, modern syntax, simplifications
ignore = ["B008"]  # FastAPI's Depends(...) in default arguments is the intended pattern

[tool.ruff.lint.per-file-ignores]
"app/mailer.py" = ["E501"]  # the HTML email template has long lines on purpose
"app/support_bot.py" = ["E501"]  # customer-facing message text reads better unwrapped
"tests/*" = ["E501"]        # test data and assertions read better on one line
"tools/*" = ["E501"]        # the category table is data laid out one category per line

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
